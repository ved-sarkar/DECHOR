<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">DECHOR architecture</title><desc id="desc">A Python Shiny form supplies seven inputs to a reactive server. A saved scaler transforms age and a saved model predicts from the feature row. Text results and a static decision-tree image appear in the interface.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a91ac"/></marker></defs>
<rect width="1120" height="500" rx="24" fill="#f5f8fc"/>
<text x="32" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#3774aa">REFERRAL-OUTCOME RESEARCH PROTOTYPE</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#132d4b">DECHOR</text><text x="32" y="110" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52647b">A compact Shiny interface around saved preprocessing and model artifacts.</text><rect x="32" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="52" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="61" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">1</text><text x="97" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Input form</text><text x="54" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">Shiny UI · seven fields</text><text x="54" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Age and headache</text><text x="54" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Dementia and motor weakness</text><text x="54" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Midline shift and CSDH size</text><text x="54" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Pre-morbid quality of life</text><rect x="400" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="420" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="429" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">2</text><text x="465" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Inference</text><text x="422" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">Reactive Python server</text><text x="422" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Transform age with the scaler</text><text x="422" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Assemble the seven-feature row</text><text x="422" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Call model.predict()</text><text x="422" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Read predict_proba() column 1</text><rect x="768" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="788" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="797" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">3</text><text x="833" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Presentation</text><text x="790" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">Shiny reactive outputs</text><text x="790" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Predicted class</text><text x="790" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Second-class probability</text><text x="790" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Static decision-tree image</text><text x="790" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Research-only interpretation</text><path d="M 354 240 L 393 240" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 722 240 L 761 240" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="400" y="389" width="320" height="66" rx="14" fill="#e8f4f2" stroke="#c8e2dc"/><text x="420" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#247967">LOADED AT STARTUP</text><text x="420" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#163e38">scaler.sav  +  dt.pkl</text><path d="M 560 387 L 560 352" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="768" y="389" width="320" height="66" rx="14" fill="#e8f4f2" stroke="#c8e2dc"/><text x="788" y="415" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#247967">BUNDLED STATIC ASSET</text><text x="788" y="441" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#163e38">decision_tree1.png</text><path d="M 928 387 L 928 352" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="414" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#162c47">app.py</text><text x="32" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">App(app_ui, server)</text><text x="32" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52647b">Source-level architecture • No training or evaluation pipeline is included in this repository.</text></svg>
